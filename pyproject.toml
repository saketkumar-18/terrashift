[project]
name = "terrashift"
version = "1.0.0"
description = "TerraShift - Sentinel-2 satellite change detection: urban growth, forest loss, mining expansion (2019-2026)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "shapely>=2.0",
  "pyproj>=3.6",
  "requests>=2.31",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pytest>=8.0",
  "joblib>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
